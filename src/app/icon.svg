<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The app mark: the duogram's idea reduced to what survives 16px. Two
    interlocked rings on the spine dark, side A sage and side B rose, woven so
    neither sits on top of the other. The initials themselves are unreadable at
    tab size; the sage/rose pairing carries the same meaning.

    Deliberately plain SVG - a path instead of rect/rx, a redrawn arc instead of
    a clipPath. The raster variants favicon.ico and apple-icon.png are generated
    from this file, and not every rasteriser supports the richer primitives.
  -->
  <path
    d="M7 0h18a7 7 0 0 1 7 7v18a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V7a7 7 0 0 1 7-7z"
    fill="#1d2621"
  />
  <g fill="none" stroke-width="3.1">
    <circle cx="11.6" cy="16" r="7.4" stroke="#a9c2ae" />
    <circle cx="20.4" cy="16" r="7.4" stroke="#d5a7ad" />
    <!-- Sage crosses over rose at the top; rose stays over sage at the bottom. -->
    <path d="M12.885 8.712A7.4 7.4 0 0 1 18.307 12.873" stroke="#a9c2ae" />
  </g>
</svg>
