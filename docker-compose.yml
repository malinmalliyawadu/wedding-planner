# Local development backing services only. The app itself runs with
# `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Stands in for Cloudflare R2, which holds guest photographs in
  # production. Worth having locally rather than stubbing: the parts
  # that actually break are the signed headers on the presigned PUT and
  # the bucket's CORS rule, and neither of those is exercised by a fake.
  #
  # SeaweedFS, because MinIO stopped publishing images: `minio/minio`
  # and `minio/mc` are gone from Docker Hub and quay.io refuses them.
  # `weed mini` is the whole store in one process and makes the bucket
  # itself on start, so there is no init container. The AWS_* pair is
  # its admin identity, and having one is what makes it check
  # signatures at all - with no identity it lets anyone in, and a ticket
  # for the wrong size or type would be accepted here and refused by R2.
  # It answers browser requests from any origin by default, so no CORS
  # step is needed here; R2 needs one, and DEPLOYMENT.md has it.
  #
  # The API on 9010, off the default port for the same reason Postgres
  # is on 5433. Pinned, so a new release cannot quietly change what a
  # fresh checkout gets.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: >
      mini -dir=/data -bucket=wedding-photos
      -admin.ui=false -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: wedding
      AWS_SECRET_ACCESS_KEY: weddingsecret
    ports:
      - "9010:8333"
    volumes:
      - seaweedfs:/data

volumes:
  pgdata:
  # Not the old `s3data`: that holds MinIO's on-disk format.
  seaweedfs:
