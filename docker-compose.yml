# Local development backing services only. The app itself runs with
# `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Stands in for whatever S3-compatible service holds guest photographs
  # in production. Worth having locally rather than stubbing: the parts
  # that actually break are the presigned POST policy and the bucket's
  # CORS rule, and neither of those is exercised by a fake.
  # Console on 9011, API on 9010, both off the default ports for the
  # same reason Postgres is on 5433.
  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wedding
      MINIO_ROOT_PASSWORD: weddingsecret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - s3data:/data

  # Creates the bucket and allows the browser to POST straight to it,
  # which is what the app's presigned uploads do. Runs once and exits.
  s3-init:
    image: minio/mc:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 wedding weddingsecret; do sleep 1; done;
      mc mb --ignore-existing local/wedding-photos;
      mc anonymous set none local/wedding-photos;
      echo 'bucket ready';
      "

volumes:
  pgdata:
  s3data:
