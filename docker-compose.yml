# Local development backing services only. The app itself runs with
# `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Stands in for Cloudflare R2, which holds guest photographs in
  # production. Worth having locally rather than stubbing: the parts
  # that actually break are the signed headers on the presigned PUT and
  # the bucket's CORS rule, and neither of those is exercised by a fake.
  # MinIO allows browser requests from any origin by default, so no CORS
  # step is needed here; R2 needs one, and DEPLOYMENT.md has it.
  # Console on 9011, API on 9010, both off the default ports for the
  # same reason Postgres is on 5433.
  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wedding
      MINIO_ROOT_PASSWORD: weddingsecret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - s3data:/data

  # Creates the bucket, private, so the app's presigned PUTs have
  # somewhere to land. Runs once and exits.
  s3-init:
    image: minio/mc:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 wedding weddingsecret; do sleep 1; done;
      mc mb --ignore-existing local/wedding-photos;
      mc anonymous set none local/wedding-photos;
      echo 'bucket ready';
      "

volumes:
  pgdata:
  s3data:
